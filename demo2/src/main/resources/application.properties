# ===== Redis / lock4j（分布式锁）=====
# Docker: docker compose -f demo2/docker/redis/docker-compose.yml up -d
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
lock4j.acquire-timeout=0
lock4j.expire=30000
lock4j.lock-key-prefix=lock4j



# ===== Snowflake 节点自动分配（服务=dc，机器=worker）=====
# Redis key 公共前缀。同一环境内各微服务应使用相同前缀，靠 spring.application.name 区分服务。
# 实际 key 形如：
#   {prefix}:dc:{应用名}           → 该服务永久绑定的 datacenterId
#   {prefix}:dc:used               → 已占用的 datacenterId 集合（跨服务共享，保证 dc 不撞）
#   {prefix}:worker:{dc}:{worker}  → 某实例对 workerId 的租约
# 仅当「多环境共用一个 Redis」时，才按环境使用不同前缀（如 dev:snowflake / prod:snowflake），
# 避免不同环境抢同一套 worker 租约；同环境内仍保持前缀一致。
app.snowflake.key-prefix=app:snowflake
# worker 租约过期时间（秒）。进程崩溃/未优雅停机时，最多等这么久，号才会被其它实例抢走。
app.snowflake.lease-ttl-seconds=30
# 心跳续约间隔（秒）。建议约为 lease-ttl 的 1/3，保证活着的实例在过期前刷新 TTL。
app.snowflake.heartbeat-interval-seconds=10



# 并行查询聚合 Demo（virtual / jdk8）
