# ===== RocketMQ（framework.rocketmq + 订单 Demo）=====
# Docker: docker compose -f demo2/docker/rocketmq/docker-compose.yml up -d
#
# 模式：1 个 Producer（不配 tag）+ N 个 Consumer（同 topic、不同 consumerGroup、tags=*）
# 每条消息会被 concurrent / orderly / audit 三个监听各收一份（fan-out）
rocketmq.consumers.orderConcurrent.enabled=true
rocketmq.consumers.orderConcurrent.namesrvAddr=127.0.0.1:9876
rocketmq.consumers.orderConcurrent.topic=DEMO_ORDER_TOPIC
rocketmq.consumers.orderConcurrent.tags=*
rocketmq.consumers.orderConcurrent.consumerGroup=demo-order-concurrent-group
rocketmq.consumers.orderConcurrent.listenerBeanName=orderConcurrentListener

rocketmq.consumers.orderOrderly.enabled=true
rocketmq.consumers.orderOrderly.namesrvAddr=127.0.0.1:9876
rocketmq.consumers.orderOrderly.topic=DEMO_ORDER_TOPIC
rocketmq.consumers.orderOrderly.tags=*
rocketmq.consumers.orderOrderly.consumerGroup=demo-order-orderly-group
rocketmq.consumers.orderOrderly.listenerBeanName=orderOrderlyListener

rocketmq.consumers.orderAudit.enabled=true
rocketmq.consumers.orderAudit.namesrvAddr=127.0.0.1:9876
rocketmq.consumers.orderAudit.topic=DEMO_ORDER_TOPIC
rocketmq.consumers.orderAudit.tags=*
rocketmq.consumers.orderAudit.consumerGroup=demo-order-audit-group
rocketmq.consumers.orderAudit.listenerBeanName=orderAuditListener

rocketmq.producers.orderProducer.enabled=true
rocketmq.producers.orderProducer.namesrvAddr=127.0.0.1:9876
rocketmq.producers.orderProducer.producerGroup=demo-order-producer-group
rocketmq.producers.orderProducer.topic=DEMO_ORDER_TOPIC
# 不配 tag：消息无 Tag；多监听靠 tags=* + 不同 consumerGroup 全量 fan-out





# ===== 延时任务（framework.delay）=====
app.delay.backend=rocketmq
app.delay.default-delay=30s
app.delay.scan-interval-ms=10000
app.delay.max-retry=3
app.delay.lock-timeout=10s
app.delay.scan-batch-size=50
app.delay.redisson-queue-name=demo2:delay:queue
app.delay.redisson-delay-queue-name=demo2:delay:delayed

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=input

# 延时任务专用 MQ（与 DEMO_ORDER_TOPIC 分离）
rocketmq.producers.delayTaskProducer.enabled=true
rocketmq.producers.delayTaskProducer.namesrvAddr=127.0.0.1:9876
rocketmq.producers.delayTaskProducer.producerGroup=demo-delay-task-producer-group
rocketmq.producers.delayTaskProducer.topic=DEMO_DELAY_TASK_TOPIC

rocketmq.consumers.delayTask.enabled=true
rocketmq.consumers.delayTask.namesrvAddr=127.0.0.1:9876
rocketmq.consumers.delayTask.topic=DEMO_DELAY_TASK_TOPIC
rocketmq.consumers.delayTask.tags=*
rocketmq.consumers.delayTask.consumerGroup=demo-delay-task-group
rocketmq.consumers.delayTask.listenerBeanName=delayTaskMqListener
